name: Trivy Security Scan

# Replaces the deprecated tfsec PR commenter (see issue #38)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  trivy-config:
    name: Trivy Config Scan (HIGH/CRITICAL)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: .terraform,*/.terraform/*
          severity: HIGH,CRITICAL
          # Report-only by design: the remaining HIGH/CRITICAL findings live
          # in pinned upstream modules or are deliberate reference-arch
          # tradeoffs. Accepted-risk register (reviewed 2026-09-17):
          # - EKS public endpoint + 0.0.0.0/0 CIDRs (CRITICAL x2): the
          #   reference stack ships no VPN; users harden per environment.
          # - App SG egress 0.0.0.0/0 (CRITICAL): correct for NAT'd private
          #   subnets (library aws-vpc default).
          # - tfstate S3 bucket without CMK (HIGH): SSE-S3 accepted for the
          #   bootstrap backend (cloudposse/tfstate-backend default).
          # Everything fixable in first-party code is fixed (private example
          # RDS, EKS envelope encryption on, VPC-scoped DB egress). Flip to
          # "1" only together with a posture change above, never silently.
          exit-code: "0"
