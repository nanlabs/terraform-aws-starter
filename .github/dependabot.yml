version: 2
updates:
  # Terraform modules and live stacks
  - package-ecosystem: "terraform"
    directories:
      - "/modules/*"
      - "/modules/*/examples/*"
      - "/live/*"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "terraform"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"

  # Node.js tooling (Danger PR review)
  - package-ecosystem: "npm"
    directory: "/tools/danger"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
