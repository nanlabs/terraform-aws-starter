# Configuration file for MegaLinter
#
# See all available variables at https://megalinter.io/latest/config-file/ and in
# linters documentation

# all, none, or list of linter keys
APPLY_FIXES: all

# If you use ENABLE variable, all other languages/formats/tooling-formats will
# be disabled by default
# ENABLE:

# If you use ENABLE_LINTERS variable, all other linters will be disabled by
# default
# ENABLE_LINTERS:

DISABLE_ERRORS_LINTERS:
  # Keep these checks visible in PR comments without blocking dependency bumps on
  # repository-wide legacy findings unrelated to the changed files.
  - ACTION_ACTIONLINT
  - ACTION_ZIZMOR
  - COPYPASTE_JSCPD
  # EDITORCONFIG flags repository-wide legacy formatting findings (missing final
  # newline on generated docs/MODULE.md, trailing whitespace) that are unrelated
  # to dependency bumps and are rewritten by terraform-docs on every run.
  - EDITORCONFIG_EDITORCONFIG_CHECKER
  - REPOSITORY_CHECKOV
  - REPOSITORY_GITLEAKS
  - REPOSITORY_GRYPE
  - REPOSITORY_KICS
  # OSV flags stale transitives inside the serverless v4 deploy toolchain that
  # have no fix within the pinned ranges (tracked in issue #69). Runtime deps
  # were migrated to AWS SDK v3 in PR #68.
  - REPOSITORY_OSV_SCANNER
  - REPOSITORY_TRIVY
  - SPELL_CSPELL
  - SPELL_LYCHEE

ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN

SHOW_ELAPSED_TIME: true

FILEIO_REPORTER: false
# Uncomment if you want MegaLinter to detect errors but not block CI to pass
# DISABLE_ERRORS: true
